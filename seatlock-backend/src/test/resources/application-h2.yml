# Test configuration — uses H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:seatlock-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always

logging:
  level:
    com.seatlock: DEBUG
